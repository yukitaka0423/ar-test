<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LiDAR 最大下腿周計 (修正機能付)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            pointer-events: none; z-index: 10;
        }
        #display-box {
            margin-top: 40px; background: rgba(0,0,0,0.7);
            padding: 20px; border-radius: 15px; text-align: center; color: white;
            border: 2px solid #00ff00; width: 70%;
        }
        #max-val { font-size: 3.5em; font-weight: bold; color: #00ff00; display: block; }
        .controls {
            position: absolute; bottom: 40px; width: 100%;
            display: flex; justify-content: center; gap: 20px; pointer-events: auto;
        }
        button {
            padding: 15px 25px; font-size: 16px; border-radius: 50px; border: none;
            font-weight: bold; cursor: pointer; color: white;
        }
        #btn-reset { background: #ff4757; box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); }
        #btn-ar { background: #2ed573; box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4); }
        #status-msg { margin-top: 10px; font-size: 0.8em; color: #aaa; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div id="display-box">
            <span style="font-size: 0.9em;">最大周計 (Max)</span>
            <span id="max-val">0.0 cm</span>
            <div id="status-msg">ふくらはぎを一周ゆっくり映してください</div>
        </div>
        
        <div class="controls">
            <button id="btn-reset">やり直し (Reset)</button>
            <button id="btn-ar">AR開始</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, maxCm = 0;
        
        init();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 10);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            const arBtn = document.getElementById('btn-ar');
            const resetBtn = document.getElementById('btn-reset');

            arBtn.addEventListener('click', () => {
                navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['hit-test'] }).then(onSessionStarted);
            });

            resetBtn.addEventListener('click', () => {
                if(confirm("現在の数値をリセットして、もう一度測り直しますか？")) {
                    maxCm = 0;
                    document.getElementById('max-val').innerText = "0.0 cm";
                    document.getElementById('status-msg').innerText = "リセット完了。再計測してください";
                }
            });
        }

        function onSessionStarted(session) {
            renderer.xr.setSession(session);
            document.getElementById('btn-ar').style.display = 'none';
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                // ここにLiDARからの距離取得と最大値更新ロジック
                // デモとして、スキャンが成功している間、微増するようなシミュレートをここで行うことも可能
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
