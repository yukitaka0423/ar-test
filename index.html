<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LiDAR Scanner Fix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            justify-content: space-between; padding: 40px 0;
            pointer-events: none; z-index: 1000;
        }
        #panel {
            background: rgba(255, 255, 255, 0.95); color: #000;
            padding: 20px; border-radius: 20px; text-align: center; width: 85%;
            pointer-events: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #val { font-size: 4em; font-weight: bold; margin: 5px 0; color: #000; }
        #status { font-size: 1em; font-weight: bold; color: #d32f2f; margin-bottom: 5px; }
        #debug-log { font-size: 0.7em; color: #666; line-height: 1.2; }
        .btns { pointer-events: auto; }
        button {
            padding: 20px 50px; font-size: 1.3em; border-radius: 50px;
            border: none; font-weight: bold; background: #007bff; color: #fff;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="panel">
            <div id="status">AR未開始</div>
            <div id="val">0.0<span style="font-size: 0.4em;">cm</span></div>
            <div id="debug-log">準備完了：ボタンを押してください</div>
        </div>
        <div class="btns">
            <button id="start-btn">計測スタート</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, hitTestSource, reticle;
        let maxCm = 0;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);

            // 🟢 より見やすいマーカー（太い輪っか）
            const geometry = new THREE.TorusGeometry(0.05, 0.01, 16, 100).rotateX(-Math.PI / 2);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            reticle = new THREE.Mesh(geometry, material);
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.getElementById('start-btn').onclick = startAR;
        }

        async function startAR() {
            try {
                const session = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['hit-test', 'local-floor']
                });
                renderer.xr.setSession(session);
                document.getElementById('start-btn').style.display = 'none';
                document.getElementById('status').innerText = "空間認識中...";

                const viewerSpace = await session.requestReferenceSpace('viewer');
                hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

                renderer.setAnimationLoop((timestamp, frame) => {
                    if (!frame) return;

                    const refSpace = renderer.xr.getReferenceSpace();
                    const hits = frame.getHitTestResults(hitTestSource);

                    if (hits.length > 0) {
                        const hit = hits[0];
                        const pose = hit.getPose(refSpace);

                        reticle.visible = true;
                        reticle.matrix.fromArray(pose.transform.matrix);
                        
                        document.getElementById('status').innerText = "計測中";
                        document.getElementById('status').style.color = "#28a745";

                        const dist = Math.abs(pose.transform.position.z);
                        // 推定周計計算（iPhoneの広角視野角に基づいた簡易計算）
                        const circum = dist * 0.52 * 3.14159 * 100; 

                        if (circum > maxCm && circum < 80) {
                            maxCm = circum;
                            document.getElementById('val').innerHTML = `${maxCm.toFixed(1)}<span style="font-size: 0.4em;">cm</span>`;
                        }
                        document.getElementById('debug-log').innerText = `認識成功: 距離 ${dist.toFixed(2)}m`;
                    } else {
                        reticle.visible = false;
                        document.getElementById('debug-log').innerText = "LiDARスキャン中... 床をゆっくり映して動かしてください";
                    }
                    renderer.render(scene, camera);
                });
            } catch (e) {
                document.getElementById('status').innerText = "エラー発生";
                document.getElementById('debug-log').innerText = e.message;
            }
        }
        init();
    </script>
</body>
</html>
