<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LiDAR Fixed Target Scan</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            justify-content: space-between; padding: 40px 0;
            pointer-events: none; z-index: 1000;
        }
        #panel {
            background: rgba(255, 255, 255, 0.9); color: #000;
            padding: 20px; border-radius: 20px; text-align: center; width: 85%;
            pointer-events: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #val { font-size: 4em; font-weight: bold; margin: 5px 0; }
        #status { font-size: 1em; font-weight: bold; color: #d32f2f; margin-bottom: 5px; }
        
        /* 🎯 画面中央の固定照準（LiDARが当たっていない時用） */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 30px; height: 30px;
            border: 2px solid white; border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none; z-index: 2000;
        }
        #crosshair::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 4px; height: 4px; background: white; border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .btns { pointer-events: auto; }
        button {
            padding: 20px 50px; font-size: 1.3em; border-radius: 50px;
            border: none; font-weight: bold; background: #007bff; color: #fff;
        }
    </style>
</head>
<body>
    <!-- 画面中央の固定ガイド -->
    <div id="crosshair"></div>

    <div id="ui">
        <div id="panel">
            <div id="status">AR未開始</div>
            <div id="val">0.0<span style="font-size: 0.4em;">cm</span></div>
            <div style="font-size: 0.7em; color: #666;">中央の円を対象に合わせてください</div>
        </div>
        <div class="btns">
            <button id="start-btn">計測スタート</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, hitTestSource, reticle;
        let maxCm = 0;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);

            // 🟢 LiDARがヒットした時に出る輪っか
            const geometry = new THREE.TorusGeometry(0.04, 0.005, 16, 100).rotateX(-Math.PI / 2);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            reticle = new THREE.Mesh(geometry, material);
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.getElementById('start-btn').onclick = startAR;
        }

        async function startAR() {
            try {
                const session = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['hit-test']
                });
                renderer.xr.setSession(session);
                document.getElementById('start-btn').style.display = 'none';
                document.getElementById('status').innerText = "空間を認識しています...";

                const viewerSpace = await session.requestReferenceSpace('viewer');
                hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

                renderer.setAnimationLoop((timestamp, frame) => {
                    if (!frame) return;

                    const refSpace = renderer.xr.getReferenceSpace();
                    const hits = frame.getHitTestResults(hitTestSource);

                    if (hits.length > 0) {
                        const hit = hits[0];
                        const pose = hit.getPose(refSpace);

                        // LiDARが当たったら輪っかを表示して吸い付かせる
                        reticle.visible = true;
                        reticle.matrix.fromArray(pose.transform.matrix);
                        
                        // 画面中央の固定ガイドを隠す（LiDARが仕事をしている証拠）
                        document.getElementById('crosshair').style.borderColor = "#00ff00";
                        document.getElementById('status').innerText = "計測中...";
                        document.getElementById('status').style.color = "#28a745";

                        const dist = Math.abs(pose.transform.position.z);
                        // 下腿周計の簡易計算（15Proの画角を考慮）
                        const circum = dist * 0.55 * Math.PI * 100; 

                        if (circum > maxCm && circum < 80) {
                            maxCm = circum;
                            document.getElementById('val').innerHTML = `${maxCm.toFixed(1)}<span style="font-size: 0.4em;">cm</span>`;
                        }
                    } else {
                        reticle.visible = false;
                        document.getElementById('crosshair').style.borderColor = "white";
                        document.getElementById('status').innerText = "床や壁を探しています...";
                        document.getElementById('status').style.color = "#d32f2f";
                    }
                    renderer.render(scene, camera);
                });
            } catch (e) {
                alert("AR開始エラー: " + e.message);
            }
        }
        init();
    </script>
</body>
</html>
