<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LiDAR Measure V3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            justify-content: space-between; padding: 40px 0;
            pointer-events: none; z-index: 1000;
        }
        #panel {
            background: rgba(255, 255, 255, 0.9); color: #000; /* 文字は黒 */
            padding: 20px; border-radius: 20px; text-align: center; width: 80%;
            pointer-events: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #val { font-size: 4em; font-weight: bold; margin: 5px 0; }
        #status { font-size: 0.9em; font-weight: bold; color: #d32f2f; }
        .btns { pointer-events: auto; }
        button {
            padding: 20px 40px; font-size: 1.2em; border-radius: 50px;
            border: none; font-weight: bold; background: #28a745; color: #fff;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="panel">
            <div style="font-size: 1.2em;">最大周計（推定）</div>
            <div id="val">0.0<span style="font-size: 0.4em;">cm</span></div>
            <div id="status">ARボタンを押してください</div>
        </div>
        <div class="btns">
            <button id="start-btn">AR計測開始</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, hitTestSource, reticle;
        let maxCm = 0;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);

            // 🎯 強調したマーカー（緑のドーナツ型）
            const geometry = new THREE.RingGeometry(0.03, 0.05, 32).rotateX(-Math.PI / 2);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            reticle = new THREE.Mesh(geometry, material);
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.getElementById('start-btn').onclick = startAR;
        }

        async function startAR() {
            const session = await navigator.xr.requestSession('immersive-ar', {
                requiredFeatures: ['hit-test']
            });
            renderer.xr.setSession(session);
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('status').innerText = "床や壁をゆっくり映して...";

            const viewerSpace = await session.requestReferenceSpace('viewer');
            hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

            renderer.setAnimationLoop((timestamp, frame) => {
                if (frame) {
                    const refSpace = renderer.xr.getReferenceSpace();
                    const hits = frame.getHitTestResults(hitTestSource);

                    if (hits.length > 0) {
                        const hit = hits[0];
                        const pose = hit.getPose(refSpace);

                        // マーカーを表示
                        reticle.visible = true;
                        reticle.matrix.fromArray(pose.transform.matrix);
                        
                        document.getElementById('status').innerText = "計測可能！";
                        document.getElementById('status').style.color = "#28a745";

                        // 距離計算 (メートル -> センチ)
                        const dist = Math.abs(pose.transform.position.z);
                        const circum = dist * Math.tan(camera.fov * Math.PI / 360) * 2 * Math.PI * 100;

                        if (circum > maxCm && circum < 70) {
                            maxCm = circum;
                            document.getElementById('val').innerHTML = `${maxCm.toFixed(1)}<span style="font-size: 0.4em;">cm</span>`;
                        }
                    } else {
                        reticle.visible = false;
                    }
                }
                renderer.render(scene, camera);
            });
        }
        init();
    </script>
</body>
</html>
